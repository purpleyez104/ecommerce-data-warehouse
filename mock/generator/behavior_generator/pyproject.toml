[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-behavior-generator"
version = "0.1.0"
description = "Standalone deterministic formal behavior event generator"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ecommerce-behavior-generator = "behavior_generator.generator:main"

[tool.setuptools.packages.find]
where = ["src"]
