[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-business-generator"
version = "0.1.0"
description = "Deterministic formal business data generator"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ecommerce-business-generator = "business_generator.generator:main"

[tool.setuptools.packages.find]
where = ["src"]
